services:
  postgres:
    image: postgres:18
    container_name: corebanking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-corebanking}
      POSTGRES_USER: ${POSTGRES_USER:-bankuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-banksecret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./deploy/postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bankuser} -d ${POSTGRES_DB:-corebanking}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - banking-net

  mailpit:
    image: axllent/mailpit:latest
    container_name: corebanking-mailpit
    restart: unless-stopped
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/api/v1/info"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - banking-net

  migrator:
    build:
      context: ./backend
      dockerfile: Dockerfile.migrator
    container_name: corebanking-migrator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-corebanking};Username=${POSTGRES_USER:-bankuser};Password=${POSTGRES_PASSWORD:-banksecret}"
    restart: "no"
    networks:
      - banking-net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: corebanking-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-corebanking};Username=${POSTGRES_USER:-bankuser};Password=${POSTGRES_PASSWORD:-banksecret}"
      Smtp__Host: mailpit
      Smtp__Port: "1025"
      Jwt__Issuer: ${Jwt__Issuer:-CoreBankingSystem}
      Jwt__Audience: ${Jwt__Audience:-CoreBankingClient}
      Jwt__Secret: ${Jwt__Secret:-SuperSecretBankingKeyThatIsAtLeast32BytesLongForSecurity!}
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - banking-net

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: corebanking-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
      - "4200:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - banking-net

volumes:
  postgres_data:
    driver: local

networks:
  banking-net:
    driver: bridge
